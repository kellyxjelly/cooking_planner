n:0 0 8px}.meal-name{font-weight:900;margin-bottom:9px}.planned-recipe{display:flex;align-items:start;gap:8px}.planned-dish-image{width:75px;height:75px;object-fit:contain;background:#fff7e8;border-radius:10px}.meal-ingredients{margin:0}.inventory-head,.day-head{width:100%;display:flex;align-items:center;justify-content:space-between;background:white;text-align:left;padding:14px;font-weight:800}.inventory-summary,.day-panel{padding:0;overflow:hidden}.inventory-body,.day-panel .meal-grid{padding:12px}.inventory-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(100px,150px);align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #eef0f5}.inventory-row label{font-size:12px;font-weight:700}.priority-list{display:grid;gap:7px}.priority{display:flex;align-items:center;gap:10px;background:#fafbff;padding:9px;border-radius:10px}.priority .name{font-weight:800}.priority .badge{margin-left:auto}.badge{border-radius:30px;background:#fff1d9;padding:5px 8px;font-size:11px;font-weight:800}.badge.urgent{background:#ffe8ea}.cov-row{display:flex;align-items:center;gap:7px;padding:4px}.cov-main{flex:1}.cov-top{display:flex;justify-content:space-between;font-size:12px}.cov-bar{height:4px;background:#e7eaf1;border-radius:5px;overflow:hidden}.cov-bar i{display:block;height:100%;background:#1aa053}.cov-bar i.short{background:#e0483b}.assigned,.monday-tag{font-size:12px;background:#eefaf1;padding:5px;border-radius:7px;margin-top:6px}.monday-note{grid-column:1/-1;background:#f5f7fb;padding:10px;border-radius:10px;font-size:12px}.monday-uni{display:flex;flex-wrap:wrap;gap:4px}.monday-tag.short{background:#fff6e5}.footer{justify-content:flex-end;margin-top:12px}.backdrop,.modal-back{position:fixed;inset:0;background:#10182a70;z-index:20;display:none}.backdrop.show,.modal-back.show{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);overflow:auto;background:white;z-index:21;padding:18px;transform:translateX(105%);transition:transform .2s}.drawer.show{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between}.close{background:none;font-size:30px}.divider{height:1px;background:var(--line);margin:16px 0}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.check{display:flex;align-items:center;gap:6px;border:1px solid #edf0f5;border-radius:8px;padding:6px;font-size:12px}.check img{width:23px;height:23px}.modal-back{z-index:30;align-items:flex-end;justify-content:center}.modal-back.show{display:flex}.modal{width:min(640px,100%);max-height:91vh;overflow:auto;background:white;border-radius:20px 20px 0 0;padding:18px}.modal h2{font-size:19px;margin:0 0 10px}.base{background:#f5f7fb;padding:9px;border-radius:8px;margin:5px 0;display:flex;align-items:center;gap:6px}.base img{width:24px}.cooked-level{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;background:#f5f7fb;padding:10px;border-radius:10px;margin:8px 0}.fill-cap,.import-total{background:#eef3ff;padding:10px;border-radius:10px;margin:8px 0}.slot-list{display:grid;gap:6px;max-height:52vh;overflow:auto}.slot-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);padding:9px;border-radius:10px}.error{padding:20px;background:#fff0f1;border-radius:12px}.empty{padding:10px;color:var(--muted)}.app-error{position:fixed;bottom:10px;left:10px;right:10px;background:#8f2830;color:white;z-index:60;padding:12px;border-radius:10px}

.ingredient-filter{position:relative;display:inline-flex}.ingredient-trigger{min-height:38px;gap:4px}.ingredient-trigger img{width:23px;height:23px;object-fit:contain}.bag-icon{width:21px;height:21px;display:inline-block;vertical-align:middle;flex:none}.filter-count{background:#eaf0ff;color:#2455c9;border-radius:20px;padding:2px 6px;font-size:11px}.ingredient-trigger.active .filter-count{background:white;color:var(--blue)}.ingredient-popover{position:fixed;top:0;left:0;z-index:18;width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;background:white;border:1px solid #dbe1ed;border-radius:15px;box-shadow:0 12px 32px #17213a30;padding:11px}.ingredient-popover[hidden]{display:none}.ingredient-popover h4{margin:0 0 8px;font-size:13px}.ingredient-icons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.ingredient-choice{position:relative;min-height:48px;background:#f8f9fc;border:2px solid transparent;border-radius:10px;display:grid;place-items:center;padding:4px}.ingredient-choice img{width:36px;height:36px;object-fit:contain}.ingredient-choice.selected{border-color:var(--blue);background:#edf3ff}.ingredient-choice.selected:after{content:'✓';position:absolute;right:0;top:0;background:var(--blue);color:white;border-radius:50%;font-size:9px;width:14px;height:14px;display:grid;place-items:center}.ingredient-options{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.ingredient-options label{font-size:12px;font-weight:800}.ingredient-options select{border:1px solid #ccd4e4;border-radius:8px;padding:5px;font-size:12px}.ingredient-options button{background:#f1f4fa;padding:6px 9px;border-radius:8px;font-size:12px;font-weight:800}.ingredient-foot{font-size:11px;color:var(--muted);margin-top:8px}

</style></head><body><div class="app"><header><div class="top"><div class="brand"><img src="./assets/images/logo.png" alt="Pokemon Sleep" onerror="this.style.display='none'"><div><h1>Cooking Planner</h1><p>Private meal and ingredient planner</p></div></div><button id="gear" class="gear" aria-label="Settings">☰</button></div><nav class="tabs"><button data-tab="today">Today</button><button data-tab="plan">Plan</button><button data-tab="recipes">Recipes</button></nav></header><main id="content">Loading recipes...</main></div><div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer"></aside><div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>
<script>
const LEVEL_BONUS={1:0,2:2,3:4,4:6,5:8,6:9,7:11,8:13,9:16,10:18,11:19,12:21,13:23,14:24,15:26,16:28,17:30,18:31,19:33,20:35,21:37,22:40,23:42,24:45,25:47,26:50,27:52,28:55,29:58,30:61,31:64,32:67,33:70,34:74,35:77,36:81,37:84,38:88,39:92,40:96,41:100,42:104,43:108,44:113,45:117,46:122,47:127,48:132,49:137,50:142,51:148,52:153,53:159,54:165,55:171,56:177,57:183,58:190,59:197,60:203,61:209,62:215,63:221,64:227,65:234,66:239,67:243,68:248,69:252,70:258};
const APP_VERSION='2026-11-16d';let ingredients=[],recipes=[],I={};
const defaultState={tab:'today',pot:32,category:'Curry / Stew',showOver:true,enabled:{},inventory:{},levels:{},plans:{},selectedSlot:null,inventoryOpen:{today:false,plan:false},dayOpen:{},makeable:false,pickerMakeable:false,mondayPicks:false,pickerMonday:false,ingredientFilter:[],ingredientMode:'any',geminiKey:'',geminiModel:'gemini-3.8-flash',geminiModels:[]};
const store={get(){try{return localStorage.getItem('cookingPlannerV1')}catch(e){return null}},set(v){try{localStorage.setItem('cookingPlannerV1',v)}catch(e){}}};
let state=(()=>{try{return JSON.parse(store.get()||'null')||structuredClone(defaultState)}catch(e){return structuredClone(defaultState)}})();
function slug(value=''){return String(value).toLowerCase().replace(/[“”"']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function categoryName(title){return title==='Salads'?'Salad':title==='Desserts'?'Dessert / Drink':'Curry / Stew'}
function save(){store.set(JSON.stringify(state))}function total(r){return Object.values(r.ings).reduce((a,b)=>a+b,0)}function recipe(id){return recipes.find(r=>r.id===id)}function recipeLevel(r){return Math.max(1,Math.min(70,Number(state.levels[r.id])||1))}function levelText(r){return state.levels[r.id]?`Lv. ${recipeLevel(r)}`:'Level not set'}function powered(r){if(!r.base)return null;const lv=state.levels[r.id];return lv?Math.round(r.base*(1+(LEVEL_BONUS[lv]||0)/100)):r.base}function allowed(r){return Object.keys(r.ings).every(id=>state.enabled[id])}
// Keep successful image loads visible. Retry a genuine failure once.
function imageLoaded(el){
  el.style.removeProperty('display');
  el.style.removeProperty('visibility');
  el.style.removeProperty('opacity');
  el.dataset.imageStatus='loaded';
  const placeholder=el.parentElement?.querySelector('.image-placeholder');
  if(placeholder)placeholder.remove();
}
function imageFallback(el){
  if(!el.dataset.retried && el.getAttribute('src')){
    el.dataset.retried='1';
    const url=new URL(el.src,location.href);
    url.searchParams.set('image_retry',Date.now().toString());
    el.src=url.href;
    return;
  }
  el.dataset.imageStatus='failed';
  el.style.removeProperty('display');
  el.style.removeProperty('visibility');
  if(el.parentElement&&!el.parentElement.querySelector('.image-placeholder')){
    const placeholder=document.createElement('span');
    placeholder.className='image-placeholder';
    placeholder.textContent='🍽️';
    placeholder.setAttribute('aria-label','Image unavailable');
    el.parentElement.appendChild(placeholder);
  }
}
// A loaded image can still have stale inline styles from a prior error.
function reconcileRecipeImages(root=document){
  root.querySelectorAll('.dish img,.planned-dish-image').forEach(el=>{
    if(el.complete&&el.naturalWidth>0)imageLoaded(el);
    else if(el.complete&&el.naturalWidth===0&&el.dataset.imageStatus!=='failed')imageFallback(el);
  });
}
function bagFilterIcon(){return `<svg class="bag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16l-1.1 12H5.1L4 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>`}
function ingredientIcon(id,className='icon'){const x=I[id];return x?`<img class="${className}" src="${x.image}" alt="${x.name}" title="${x.name}" onload="imageLoaded(this)" onerror="imageFallback(this)">`:`<span>❔</span>`}function iconList(ings){return Object.entries(ings).map(([id,q])=>`<span class="ing">${ingredientIcon(id)} ${q}</span>`).join('')}
function day(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}function dk(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function label(n){return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':day(n).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}function mondayOffset(){const dow=day(0).getDay();return ((8-dow)%7)||7}function weekStart(){return -((day(0).getDay()+6)%7)}function slotLabel(d){return d===mondayOffset()?'Next Monday':label(d)}function slotsFor(from,to){const out=[];for(let d=from;d<=to;d++)for(const meal of ['Breakfast','Lunch','Dinner'])out.push({day:d,meal,label:slotLabel(d),past:d<0,key:dk(day(d))+'-'+meal});return out}function slots(range=7){return range===1?slotsFor(0,0):slotsFor(0,mondayOffset())}
function needs(range=7){const n={};slots(range).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(p&&!p.cooked&&r)Object.entries(r.ings).forEach(([id,q])=>n[id]=(n[id]||0)+q)});return n}function shortageTimeline(){const bal={...state.inventory},out=[];slots(7).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!p||p.cooked||!r)return;Object.entries(r.ings).forEach(([id,q])=>{bal[id]=(bal[id]||0)-q;if(bal[id]<0&&!out.some(x=>x.id===id))out.push({id,short:-bal[id],slot:s})})});return out}
function clearWeek(scope){const keys=scope==='today'?slots(1).map(x=>x.key):scope==='plan'?slotsFor(weekStart(),mondayOffset()).map(x=>x.key):slots(7).map(x=>x.key);const used=keys.filter(k=>state.plans[k]).length;if(!used){alert('There are no meals planned yet.');return}if(!confirm(`Clear ${used} planned meals? Your inventory, levels and settings will be kept.`))return;keys.forEach(k=>delete state.plans[k]);save();render()}
function setTab(t){state.tab=t;save();render()}function setInventory(id,value){state.inventory[id]=Math.max(0,Number(value)||0);save();render()}
function stepper(id,value,kind='inv',min=0,max=''){return `<div class="stepper"><button type="button" data-step="-1" data-${kind}="${id}">−</button><input data-${kind}-input="${id}" type="number" min="${min}" ${max!==''?`max="${max}"`:''} value="${Math.max(min,value||0)}"><button type="button" data-step="1" data-${kind}="${id}">+</button></div>`}
function inventoryPanel(view){const n=needs(view==='today'?1:7),inventoryTotal=Object.values(state.inventory).reduce((a,b)=>a+(+b||0),0),needed=Object.values(n).reduce((a,b)=>a+b,0),open=!!state.inventoryOpen[view];return `<section class="panel inventory-summary"><button class="inventory-head" data-toggle-inventory="${view}"><span>Ingredients<br><small class="hint">${inventoryTotal} in inventory · ${needed} needed</small></span><span>${open?'Hide ▴':'Show ▾'}</span></button>${open?`<div class="inventory-body"><div class="inventory-list">${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="inventory-row">${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id,state.inventory[x.id]||0)}</div>`).join('')}</div><div class="row"><button class="primary" data-upload>Upload bag screenshots</button></div><p class="hint">Changes save immediately.</p></div>`:''}</section>`}
function coveragePanel(range=7){const n=needs(range);const rows=ingredients.filter(x=>state.enabled[x.id]&&(n[x.id]||0)>0).map(x=>{const need=n[x.id]||0,have=state.inventory[x.id]||0,pct=Math.min(100,Math.round(have/need*100)),delta=have-need;return `<div class="cov-row"><b>${need}</b>${ingredientIcon(x.id)}<div class="cov-main"><div class="cov-top"><span>${pct}%</span><span>${delta<0?delta:'+'+delta}</span></div><div class="cov-bar"><i class="${delta<0?'short':''}" style="width:${pct}%"></i></div></div></div>`}).join('');const required=Object.values(n).reduce((a,b)=>a+b,0),missing=Object.entries(n).reduce((a,[id,q])=>a+Math.max(0,q-(state.inventory[id]||0)),0),extra=ingredients.reduce((a,x)=>a+Math.max(0,(state.inventory[x.id]||0)-(n[x.id]||0)),0);return `<section class="panel"><h2 class="title">Summary <small>Unfinished base recipes through next Monday</small></h2>${rows?`<div class="cov-list">${rows}</div>`:'<div class="empty">Nothing planned to cook yet.</div>'}<div class="stats"><div class="stat"><b>${required}</b><span>Required</span></div><div class="stat"><b>${missing}</b><span>Shortfall</span></div><div class="stat"><b>${extra}</b><span>Extras</span></div></div></section>`}
function timelinePanel(){const short=shortageTimeline();return `<section class="panel"><h2 class="title">Ingredient timeline <small>First shortages through next Monday</small></h2>${short.length?`<div class="priority-list">${short.map(x=>`<div class="priority">${ingredientIcon(x.id)}<div><div class="name">${I[x.id]?.name||x.id}</div><div class="sub">Need ${x.short} more by ${x.slot.label} ${x.slot.meal}</div></div><span class="badge ${x.slot.day<2?'urgent':''}">${x.slot.day===0?'Today':x.slot.day===1?'Tomorrow':'Later'}</span></div>`).join('')}</div>`:'<div class="empty">Your current planned base recipes are covered.</div>'}</section>`}
function surplusPanel(){const n=needs(),surplus=ingredients.map(x=>({x,q:Math.max(0,(state.inventory[x.id]||0)-(n[x.id]||0))})).filter(x=>x.q>0);return `<section class="panel"><h2 class="title">Filler surplus</h2>${surplus.length?`<div class="ings">${surplus.map(({x,q})=>`<span class="ing">${ingredientIcon(x.id)} ${q}</span>`).join('')}</div>`:'<div class="empty">No filler surplus right now.</div>'}</section>`}
function recipeAssignments(id){return slots(7).filter(x=>state.plans[x.key]?.recipe===id).map(x=>({label:`${x.label} · ${x.meal}`,cooked:!!state.plans[x.key].cooked}))}
function recipeCard(r,selectable=true,note=''){const over=total(r)>state.pot,value=powered(r),strength=value===null?'Base strength: —':`Base strength: ${value.toLocaleString()}`;const a=recipeAssignments(r.id),assigned=a.length?`<div class="assigned">Planned: ${a.slice(0,2).map(x=>x.label+(x.cooked?' (cooked)':'')).join(', ')}${a.length>2?` +${a.length-2} more`:''}</div>`:'';return `<article class="recipe ${over?'over':''}"><div class="recipe-top"><div class="dish"><img src="${r.image}" alt="${r.name}" onload="imageLoaded(this)" onerror="imageFallback(this)"></div><div><h3>${r.name}</h3><div class="category">${r.cat}</div></div></div><div class="ing-total">${total(r)} INGREDIENTS</div><div class="level-row"><span class="hint">Lv.</span>${stepper(r.id,state.levels[r.id]||1,'rlevel',1,70)}</div><div class="power"><b>${strength}</b></div>${note}${assigned}<div class="ings">${iconList(r.ings)}</div>${selectable?`<button class="primary select" data-pick="${r.id}">Add to a meal</button>`:''}</article>`}
function canLateCook(s){return s.day===-1&&new Date().getHours()<4&&!state.plans[s.key]?.cooked}

function bindModalStepper(kind,min=0,max=Infinity){document.querySelectorAll(`[data-${kind}]`).forEach(b=>b.onclick=()=>{const input=document.querySelector(`[data-${kind}-input="${b.dataset[kind]}"]`);input.value=Math.max(min,Math.min(max,(+input.value||0)+Number(b.dataset.step)))})}
function fillerSum(){return [...document.querySelectorAll('[data-fill-input]')].reduce((a,el)=>a+Math.max(0,+el.value||0),0)}
function bindFillerCap(baseTotal,pot){const cap=Math.max(0,pot-baseTotal),inputs=[...document.querySelectorAll('[data-fill-input]')];const update=()=>{let sum=fillerSum();if(sum>cap){let over=sum-cap;for(let i=inputs.length-1;i>=0&&over>0;i--){const v=Math.max(0,+inputs[i].value||0),cut=Math.min(v,over);inputs[i].value=v-cut;over-=cut}sum=fillerSum()}const left=cap-sum,box=document.getElementById('fillCap');if(box)box.textContent=`Pot size ${pot} - ${baseTotal} base ingredients = ${cap} fillers allowed · ${left} left`;document.querySelectorAll('[data-fill][data-step="1"]').forEach(b=>b.disabled=left<=0)};inputs.forEach(el=>{el.oninput=update;el.onchange=update});document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{const el=document.querySelector(`[data-fill-input="${b.dataset.fill}"]`);if(Number(b.dataset.step)>0&&cap-fillerSum()<=0)return;el.value=Math.max(0,(+el.value||0)+Number(b.dataset.step));update()});update()}
function openCook(slot){const p=state.plans[slot],r=p&&recipe(p.recipe);if(!r||p.cooked)return;const baseTotal=total(r);let mealPot=Math.max(1,Math.round(Number(state.pot)||1));openModal(`<h2>Mark cooked</h2><p class="hint">Confirm recipe level and pot size, then enter only fillers actually used.</p><div class="cooked-level"><label>Recipe level<br><small class="hint">Saved for ${r.name}</small></label>${stepper(r.id,state.levels[r.id]||1,'level',1,70)}</div><div class="cooked-level"><label>Pot size for this meal<br><small class="hint">Normal pot size stays unchanged</small></label><div class="stepper"><button id="cookPotMinus">−</button><input id="cookPot" type="number" min="1" value="${mealPot}"><button id="cookPotPlus">+</button></div></div><h3>Base recipe</h3>${Object.entries(r.ings).map(([id,q])=>`<div class="base">${ingredientIcon(id)} ${I[id]?.name||id}: <b>${q}</b></div>`).join('')}<h3>Add fillers used</h3><div id="fillCap" class="fill-cap"></div><div class="inventory-list">${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="inventory-row">${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id,0,'fill')}</div>`).join('')}</div><div class="footer"><button id="cancelCook" class="secondary">Cancel</button><button id="confirmCook" class="primary">Confirm cooked</button></div>`);const potInput=document.getElementById('cookPot'),confirmButton=document.getElementById('confirmCook');bindModalStepper('level',1,70);function refresh(){bindFillerCap(baseTotal,mealPot);confirmButton.disabled=mealPot<baseTotal;if(mealPot<baseTotal)document.getElementById('fillCap').textContent=`Recipe needs ${baseTotal} ingredients. Increase pot size.`}function update(v){const n=Number(v);if(String(v).trim()!==''&&Number.isFinite(n))mealPot=Math.max(1,Math.round(n));potInput.value=mealPot;refresh()}potInput.onchange=()=>update(potInput.value);document.getElementById('cookPotMinus').onclick=()=>{update(potInput.value);update(mealPot-1)};document.getElementById('cookPotPlus').onclick=()=>{update(potInput.value);update(mealPot+1)};refresh();document.getElementById('cancelCook').onclick=closeModal;confirmButton.onclick=()=>{update(potInput.value);if(mealPot<baseTotal||p.cooked)return;state.levels[r.id]=Math.max(1,Math.min(70,Math.round(Number(document.querySelector(`[data-level-input="${r.id}"]`).value))||1));const used={...r.ings};document.querySelectorAll('[data-fill-input]').forEach(el=>{const q=Math.max(0,+el.value||0);if(q)used[el.dataset.fillInput]=(used[el.dataset.fillInput]||0)+q});Object.entries(used).forEach(([id,q])=>state.inventory[id]=Math.max(0,(state.inventory[id]||0)-q));p.cooked=true;save();closeModal();render()}}
async function listGeminiModels(){const key=(state.geminiKey||'').trim();if(!key)throw new Error('Paste your Gemini API key first.');const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`);if(!r.ok)throw new Error(`Could not list models (${r.status})`);const j=await r.json();return(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name).replace(/^models\//,'')).filter(n=>/^gemini/.test(n)&&!/embedding|aqa|image|tts|live|audio/i.test(n))}
function pickGeminiModel(list){const score=n=>{let s=0;if(/flash/.test(n))s+=100;if(/lite/.test(n))s-=25;if(/pro/.test(n))s+=40;if(/preview|exp/.test(n))s-=30;const m=n.match(/gemini-(\d+)(?:\.(\d+))?/);if(m)s+=(+m[1])*20+(+(m[2]||0));return s};return[...list].sort((a,b)=>score(b)-score(a))[0]||'gemini-3.8-flash'}
function fileToBase64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=()=>rej(new Error('Could not read '+file.name));fr.readAsDataURL(file)})}
async function readBagWithGemini(files,onProgress){const key=(state.geminiKey||'').trim();if(!key)throw new Error('No Gemini API key saved.');const model=state.geminiModel||'gemini-3.8-flash',names=ingredients.map(x=>x.name).join(', '),found={};for(let f=0;f<files.length;f++){onProgress(`Gemini is reading screenshot ${f+1} of ${files.length}…`);const b64=await fileToBase64(files[f]);const prompt=`This is a Pokémon Sleep bag ingredient inventory screenshot. For every visible ingredient tile identify its name and quantity in the xN badge. Use only these ingredient names: ${names}. Ignore Pokémon, candies, items, and unreadable quantities. Respond with JSON only: {"items":[{"name":"Fancy Egg","count":30}]}`;const body={contents:[{parts:[{text:prompt},{inline_data:{mime_type:files[f].type||'image/jpeg',data:b64}}]}],generationConfig:{temperature:0,responseMimeType:'application/json'}};const callModel=mdl=>fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mdl)}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let resp=await callModel(model);if(!resp.ok&&(resp.status===400||resp.status===404)){onProgress('Finding a current Gemini model…');const list=await listGeminiModels(),alt=pickGeminiModel(list);state.geminiModels=list;state.geminiModel=alt;save();resp=await callModel(alt)}if(!resp.ok){let detail='';try{const j=await resp.json();detail=j.error?.message||''}catch(e){}throw new Error(`Gemini request failed (${resp.status}) ${detail}`)}const data=await resp.json(),text=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');let parsed;try{parsed=JSON.parse(text)}catch(e){const match=text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);if(match)parsed=JSON.parse(match[0])}const items=Array.isArray(parsed)?parsed:(parsed?.items||[]);if(!items.length)throw new Error('Gemini did not return readable counts.');items.forEach(it=>{const raw=String(it.name||it.ingredient||''),count=Number(String(it.count??it.quantity).replace(/[^0-9]/g,''));if(!raw||!Number.isFinite(count))return;let hit=ingredients.find(x=>x.name.toLowerCase()===raw.toLowerCase());if(!hit)for(const word of raw.split(/\s+/).reverse()){hit=ingredientByKeyword(word);if(hit)break}if(hit)found[hit.id]={value:Math.min(9999,Math.max(0,count)),sure:true}})}return found}
function loadOCR(){if(window.__ocrPromise)return window.__ocrPromise;window.__ocrPromise=new Promise((res,rej)=>{if(window.Tesseract)return res(window.Tesseract);const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';sc.onload=()=>res(window.Tesseract);sc.onerror=()=>rej(new Error('Could not load text recognition. Check connection.'));document.head.appendChild(sc)});return window.__ocrPromise}
function fileToImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('Could not open '+file.name));img.src=URL.createObjectURL(file)})}
function cropCanvas(img,x0,y0,w,h,scale=4){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));const g=c.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,x0,y0,w,h,0,0,c.width,c.height);return c}
function editDistance(a,b){const m=[];for(let i=0;i<=b.length;i++){m[i]=[i];for(let j=1;j<=a.length;j++)m[i][j]=i===0?j:Math.min(m[i-1][j-1]+(b[i-1]===a[j-1]?0:1),m[i][j-1]+1,m[i-1][j]+1)}return m[b.length][a.length]}
function ingredientByKeyword(word){const w=word.toLowerCase().replace(/[^a-z]/g,'');if(w.length<3)return null;let best=null,bestScore=99;ingredients.forEach(x=>x.name.toLowerCase().split(/\s+/).forEach(p=>{const key=p.replace(/[^a-z]/g,'');if(key.length<4)return;const d=editDistance(w,key);if(d<bestScore&&d<=(key.length>=7?2:1)){bestScore=d;best=x}}));return best}
async function readBagScreenshots(files,onProgress){const T=await loadOCR(),found={},worker=await T.createWorker('eng');try{for(let f=0;f<files.length;f++){onProgress(`Reading screenshot ${f+1} of ${files.length}…`);const img=await fileToImage(files[f]),page=await worker.recognize(img),words=(page.data.words||[]).filter(w=>w.text?.trim()),anchors=[];words.forEach(w=>{const hit=ingredientByKeyword(w.text);if(!hit)return;const b=w.bbox;anchors.push({id:hit.id,cx:(b.x0+b.x1)/2,top:b.y0,h:b.y1-b.y0})});const byId={};anchors.forEach(a=>{if(!byId[a.id]||a.top<byId[a.id].top)byId[a.id]=a});for(const a of Object.values(byId)){const unit=Math.max(18,a.h),variants=[[-2.2,-6,6.6,-2.3],[-3.3,-6.3,7.7,-2],[-1.6,-5.7,8.3,-2.6],[-4,-6.6,9,-1.8]];let best=null;for(const v of variants){const x0=Math.max(0,a.cx+v[0]*unit),y0=Math.max(0,a.top+v[1]*unit),w=Math.min(img.naturalWidth-x0,(v[2]-v[0])*unit),h=Math.min(img.naturalHeight-y0,(v[3]-v[1])*unit);if(w<8||h<8)continue;const canvas=cropCanvas(img,x0,y0,w,h);await worker.setParameters({tessedit_char_whitelist:'0123456789x',tessedit_pageseg_mode:'7'});const r=await worker.recognize(canvas);await worker.setParameters({tessedit_char_whitelist:'',tessedit_pageseg_mode:'3'});const txt=(r.data.text||'').replace(/\s/g,'').toLowerCase(),conf=r.data.confidence||0,strict=txt.match(/^x(\d{1,4})$/),loose=txt.match(/(\d{1,4})/),cand=strict?{v:+strict[1],conf,sure:true}:(loose?{v:+loose[1],conf,sure:false}:null);if(cand&&(!best||(cand.sure&&!best.sure)||(cand.sure===best.sure&&cand.conf>best.conf)))best=cand;if(best?.sure&&best.conf>=80)break}if(best)found[a.id]={value:Math.min(9999,best.v),sure:best.sure&&best.conf>=70}}}}finally{await worker.terminate()}return found}
function updateImportTotal(){const box=document.getElementById('importTotal');if(!box)return;const inputs=[...document.querySelectorAll('[data-import-input]')];if(!inputs.length){box.style.display='none';return}const total=inputs.reduce((a,el)=>a+Math.max(0,+el.value||0),0);box.style.display='block';box.innerHTML=`<b>${total.toLocaleString()}</b> ingredients total <span class="hint">Check this matches your bag</span>`}
function openUpload(){openModal(`<h2>Import bag screenshots</h2><p class="hint">Choose one or more Pokémon Sleep bag screenshots. ${(state.geminiKey||'').trim()?'Gemini will read the screenshots using your API key.':'On-device OCR will read the screenshots. Add a Gemini key in Settings for improved recognition.'} Always check numbers before applying.</p><input id="shots" type="file" accept="image/*" multiple><div id="preview" class="hint" style="margin-top:10px"></div><div id="importTotal" class="import-total" style="display:none"></div><div id="reviewRows"></div><div class="footer"><button id="cancelUpload" class="secondary">Cancel</button><button id="applyUpload" class="primary">Apply confirmed counts</button></div>`);document.getElementById('cancelUpload').onclick=closeModal;function drawReview(read){const list=ingredients.filter(x=>state.enabled[x.id]);document.getElementById('reviewRows').innerHTML=`<div class="inventory-list">${list.map(x=>{const hit=read?.[x.id],v=hit?hit.value:(state.inventory[x.id]||0);return `<div class="inventory-row" style="background:${hit?(hit.sure?'#eefaf1':'#fff6e5'):'white'}">${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id,v,'import')}</div>`}).join('')}</div>`;bindModalStepper('import');const rows=document.getElementById('reviewRows');rows.oninput=updateImportTotal;rows.onclick=()=>setTimeout(updateImportTotal,0);updateImportTotal()}document.getElementById('shots').onchange=async e=>{const files=[...e.target.files],note=document.getElementById('preview');if(!files.length){note.textContent='No screenshots selected.';drawReview(null);return}note.textContent=`Reading ${files.length} screenshots…`;drawReview(null);try{let read,engine='';if((state.geminiKey||'').trim()){try{read=await readBagWithGemini(files,msg=>note.textContent=msg);engine='Gemini'}catch(err){note.textContent=`Gemini failed: ${err.message}. Falling back to on-device OCR…`;read=await readBagScreenshots(files,msg=>note.textContent=msg);engine='On-device OCR'}}else{read=await readBagScreenshots(files,msg=>note.textContent=msg);engine='On-device OCR'}note.textContent=`${engine}: ${Object.keys(read).length} ingredient counts found. Review and apply.`;drawReview(read)}catch(err){note.textContent=err.message;drawReview(null)}};document.getElementById('applyUpload').onclick=()=>{document.querySelectorAll('[data-import-input]').forEach(el=>state.inventory[el.dataset.importInput]=Math.max(0,+el.value||0));save();closeModal();render()}}
function exportData(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='cooking-planner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);initializeState();save();closeDrawer();render();alert('Backup imported.')}catch(err){alert('That file could not be read as a backup.')}};r.readAsText(f)}
function initializeState(){state.enabled||={};state.inventory||={};state.levels||={};state.plans||={};state.dayOpen||={};state.inventoryOpen||={today:false,plan:false};state.ingredientFilter=Array.isArray(state.ingredientFilter)?state.ingredientFilter.filter(id=>ingredients.some(x=>x.id===id)):[];if(!['any','all'].includes(state.ingredientMode))state.ingredientMode='any';state.selectedSlot=null;if(/gemini-(1\.5|2\.0|2\.5)/.test(state.geminiModel||'')){state.geminiModel='gemini-3.8-flash';state.geminiModels=[]}ingredients.forEach(x=>{if(state.enabled[x.id]===undefined)state.enabled[x.id]=true;if(state.inventory[x.id]===undefined)state.inventory[x.id]=0});if(!['All Recipes','Curry / Stew','Salad','Dessert / Drink'].includes(state.category))state.category='Curry / Stew'}
function normalizeData(ingredientData,recipeGroups){ingredients=ingredientData.map(raw=>({id:slug(raw.name),name:raw.name,image:raw.imageSrc||''}));I=Object.fromEntries(ingredients.map(x=>[x.id,x]));recipes=[];recipeGroups.forEach(group=>{const cat=categoryName(group.title);(group.recipes||[]).forEach(raw=>{if(!Array.isArray(raw.ingredients)||!raw.ingredients.length)return;const ings={};raw.ingredients.forEach(item=>{const id=slug(item.name);ings[id]=(ings[id]||0)+(Number(item.quantity)||0)});recipes.push({id:slug(raw.name),name:raw.name,cat,base:Number(raw.baseStrength)||0,ings,image:slug(raw.name)==='hidden-power-perk-up-stew'&&raw.imageSrc?raw.imageSrc+(raw.imageSrc.includes('?')?'&':'?')+'v='+APP_VERSION:(raw.imageSrc||'')})})})}
async function loadData(){try{const [ingResponse,recipeResponse]=await Promise.all([fetch('./data/ingredients.json'),fetch('./data/recipes.json')]);if(!ingResponse.ok)throw new Error(`Could not load ingredients.json (${ingResponse.status})`);if(!recipeResponse.ok)throw new Error(`Could not load recipes.json (${recipeResponse.status})`);const [ingData,recipeData]=await Promise.all([ingResponse.json(),recipeResponse.json()]);normalizeData(ingData,recipeData);if(!ingredients.length||!recipes.length)throw new Error('No ingredient or recipe data found.');initializeState();save();render()}catch(error){document.getElementById('content').innerHTML=`<div class="error"><b>The planner could not load its recipe data.</b><p>${error.message}</p><code>Expected: ./data/ingredients.json and ./data/recipes.json</code></div>`;console.error(error)}}
loadData();
</script></body></html>
