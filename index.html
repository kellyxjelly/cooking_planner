ntory-row.read-ok{background:#eefaf1;border-radius:9px}.inventory-row.read-ok label{color:#146c34}.slot-list{display:grid;gap:6px;max-height:52vh;overflow:auto}.slot-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px}.loading{padding:30px;text-align:center;color:var(--muted)}.error{margin:20px auto;max-width:700px;background:#fff0f1;border:1px solid #ffd2d5;border-radius:14px;padding:16px;color:#8f2830}.error code{display:block;background:#fff;padding:8px;border-radius:7px;margin-top:8px;color:#4b5565;overflow:auto}
    @media(max-width:620px){.app{padding:0 10px 32px}header{margin:0 -10px 14px;padding:10px 10px 0}.top{min-height:48px}.app-logo{height:39px;max-width:112px}.brand{gap:9px}.brand-copy h1{font-size:17px}.brand-copy p{display:none}.gear{width:38px;height:38px}.tabs button{padding:9px 12px 11px}.meal-grid{grid-template-columns:1fr}.recipes{gap:8px}.recipe{padding:10px}.dish{width:43px;height:43px}.recipe h3{font-size:13px}.ing-total{font-size:16px}.ing{font-size:12px;padding:3px 6px}.stat{padding:8px}.stat b{font-size:18px}.inventory-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 3px}.inventory-row{grid-template-columns:32px minmax(0,1fr) 72px;gap:3px;padding:6px 0}.inventory-row label{font-size:10px;line-height:1.15;overflow-wrap:normal;word-break:keep-all;hyphens:none}.inventory-row .icon{width:32px;height:32px}.inventory-row .stepper{grid-template-columns:18px minmax(34px,1fr) 18px;min-height:27px;border-radius:8px}.inventory-row .stepper button{font-size:16px;line-height:1}.inventory-row .stepper input{padding:4px 1px;font-size:13px;font-weight:800;letter-spacing:-.2px}.filler,.review{grid-template-columns:1fr}.filler .stepper,.review .stepper{grid-column:1 / -1}.planned-recipe{grid-template-columns:72px minmax(0,1fr)}.planned-dish-image{width:72px;height:72px}.cooked-level{grid-template-columns:minmax(0,1fr) 112px}.cooked-level .stepper{max-width:112px}}

<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand">
        <img class="app-logo" src="./assets/images/logo.png" alt="Pokémon Sleep" onerror="this.style.display='none'">
        <div class="brand-copy"><h1>Cooking Planner</h1><p>Private meal and ingredient planner</p></div>
      </div>
      <button id="gear" class="gear" aria-label="Open settings" title="Settings">☰</button>
    </div>
    <nav class="tabs"><button data-tab="today">Today</button><button data-tab="plan">Plan</button><button data-tab="recipes">Recipes</button></nav>
  </header>
  <main id="content"><div class="loading">Loading recipes and ingredient images…</div></main>
</div>
<div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer"></aside><div id="modalBack" class="modal-back"><div id="modal" class="modal"></div></div>
<!-- Planner logic, saved settings, meal scheduling, and screenshot import. -->
<script>
// Percentage bonuses by recipe level (not experience thresholds).
const LEVEL_BONUS={1:0,2:2,3:4,4:6,5:8,6:9,7:11,8:13,9:16,10:18,11:19,12:21,13:23,14:24,15:26,16:28,17:30,18:31,19:33,20:35,21:37,22:40,23:42,24:45,25:47,26:50,27:52,28:55,29:58,30:61,31:64,32:67,33:70,34:74,35:77,36:81,37:84,38:88,39:92,40:96,41:100,42:104,43:108,44:113,45:117,46:122,47:127,48:132,49:137,50:142,51:148,52:153,53:159,54:165,55:171,56:177,57:183,58:190,59:197,60:203,61:209,62:215,63:221,64:227,65:234,66:239,67:243,68:248,69:252,70:258};
const APP_VERSION='2026-09-23d';
let ingredients=[],recipes=[],I={};
// Default preferences and saved planner data for a new browser.
const defaultState={tab:'today',pot:32,category:'Curry / Stew',showOver:true,enabled:{},inventory:{},levels:{},plans:{},selectedSlot:null,inventoryOpen:{today:false,plan:false},dayOpen:{},makeable:false,pickerMakeable:false,geminiKey:'',geminiModel:'gemini-3.8-flash',geminiModels:[]};
// Browser storage wrapper; existing backup and storage formats are preserved.
const store={get(){try{return localStorage.getItem('cookingPlannerV1')}catch(e){return null}},set(v){try{localStorage.setItem('cookingPlannerV1',v)}catch(e){}}};
let state=(()=>{try{return JSON.parse(store.get()||'null')||structuredClone(defaultState)}catch(e){return structuredClone(defaultState)}})();state.enabled||={};state.inventory||={};state.levels||={};state.plans||={};state.inventoryOpen||={today:false,plan:false};
function slug(value=''){return String(value).toLowerCase().replace(/[“”"']/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function categoryName(title){if(title==='Salads')return 'Salad';if(title==='Desserts')return 'Dessert / Drink';return 'Curry / Stew'}
function save(){store.set(JSON.stringify(state))}function total(r){return Object.values(r.ings).reduce((a,b)=>a+b,0)}function recipe(id){return recipes.find(r=>r.id===id)}function recipeLevel(r){return Math.max(1,Math.min(70,Number(state.levels[r.id])||0))}function levelText(r){return state.levels[r.id]?`Lv. ${recipeLevel(r)}`:'Level not set'}function powered(r){if(!r.base)return null;const lv=state.levels[r.id];return lv?Math.round(r.base*(1+(LEVEL_BONUS[lv]||0)/100)):r.base}function allowed(r){return Object.keys(r.ings).every(id=>state.enabled[id])}
function imageFallback(el){el.style.display='none';const p=el.parentElement;if(p&&!p.textContent.trim())p.textContent='🍽️'}function ingredientIcon(id,className='icon'){const x=I[id];return x?`<img class="${className}" src="${x.image}" alt="${x.name}" title="${x.name}" onerror="imageFallback(this)">`:`<span title="${id}">❔</span>`}function iconList(ings){return Object.entries(ings).map(([id,q])=>`<span class="ing" title="${I[id]?.name||id}">${ingredientIcon(id)} ${q}</span>`).join('')}
function day(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}function dk(d){return d.toISOString().slice(0,10)}function label(n){return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':day(n).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}function mondayOffset(){const dow=day(0).getDay();return ((8-dow)%7)||7}function weekStart(){return -((day(0).getDay()+6)%7)}function slotLabel(d){return d===mondayOffset()?'Next Monday':label(d)}function slotsFor(from,to){const out=[];for(let d=from;d<=to;d++)for(const meal of ['Breakfast','Lunch','Dinner'])out.push({day:d,meal,label:slotLabel(d),past:d<0,key:dk(day(d))+'-'+meal});return out}function slots(range=7){return range===1?slotsFor(0,0):slotsFor(0,mondayOffset())}
function needs(range=7){const n={};slots(range).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(p&&!p.cooked&&r)Object.entries(r.ings).forEach(([id,q])=>n[id]=(n[id]||0)+q)});return n}function shortageTimeline(){const bal={...state.inventory},out=[];slots(7).forEach(s=>{const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!p||p.cooked||!r)return;Object.entries(r.ings).forEach(([id,q])=>{bal[id]=(bal[id]||0)-q;if(bal[id]<0&&!out.some(x=>x.id===id))out.push({id,short:-bal[id],slot:s})})});return out}
function clearWeek(scope){const keys=scope==='today'?slots(1).map(x=>x.key):scope==='plan'?slotsFor(weekStart(),mondayOffset()).map(x=>x.key):slots(7).map(x=>x.key);const used=keys.filter(k=>state.plans[k]).length;if(!used){alert(scope==='today'?'There are no meals planned for today yet.':'There are no meals planned this week yet.');return}if(!confirm(scope==='plan'?`Reset plan? This clears all ${used} planned meals. Your inventory, recipe levels, and settings are kept.`:scope==='today'?`Clear all ${used} of today\u2019s meal slots? Your inventory, recipe levels, and settings are kept.`:`Clear all ${used} planned meals from today through next Monday? Your inventory, recipe levels, and settings are kept.`))return;keys.forEach(k=>{delete state.plans[k]});save();render()}
function setTab(t){state.tab=t;save();render()}function setInventory(id,value){state.inventory[id]=Math.max(0,Number(value)||0);save();render()}
// Shared quantity control used for inventory, recipe levels, and fillers.
function stepper(id,value,kind='inv',min=0,max=''){return `<div class="stepper"><button type="button" data-step="-1" data-${kind}="${id}" aria-label="Decrease ${I[id]?.name||id}">−</button><input data-${kind}-input="${id}" type="number" min="${min}" ${max!==''?`max="${max}"`:''} value="${Math.max(min,value||0)}" aria-label="${I[id]?.name||id} quantity"><button type="button" data-step="1" data-${kind}="${id}" aria-label="Increase ${I[id]?.name||id}">+</button></div>`}
function inventoryPanel(view){const n=needs(view==='today'?1:7),inventoryTotal=Object.values(state.inventory).reduce((a,b)=>a+(+b||0),0),needed=Object.values(n).reduce((a,b)=>a+b,0),open=!!state.inventoryOpen[view];return `<section class="panel inventory-summary"><button class="inventory-head" data-toggle-inventory="${view}" aria-expanded="${open}"><span class="inv-label">Ingredients</span><span class="inv-meta">${inventoryTotal} in inventory · ${needed} needed for ${view==='today'?'today':'planned meals'}</span><span class="chevron">${open?'Hide ▴':'Show ▾'}</span></button>${open?`<div class="inventory-body"><div class="inventory-list">${ingredients.filter(x=>state.enabled[x.id]).map(x=>`<div class="inventory-row">${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id,state.inventory[x.id]||0)}</div>`).join('')}</div><div class="inventory-actions"><button class="primary" data-upload>Upload bag screenshots</button></div><p class="hint">Tap − or + for quick changes, or type an exact amount. Updates save immediately.</p></div>`:''}</section>`}
function coveragePanel(range=7){const n=needs(range);const rows=ingredients.filter(x=>state.enabled[x.id]&&(n[x.id]||0)>0).map(x=>{const need=n[x.id]||0,have=state.inventory[x.id]||0,pct=need?Math.min(100,Math.round(have/need*100)):100,delta=have-need;return `<div class="cov-row"><span class="cov-need">${need}</span>${ingredientIcon(x.id,'cov-icon')}<div class="cov-main"><div class="cov-top"><span class="cov-pct">${pct}%</span><span class="cov-delta ${delta<0?'short':'ok'}">${delta<0?delta:'+'+delta}</span></div><div class="cov-bar"><i class="${delta<0?'short':'ok'}" style="width:${pct}%"></i></div></div></div>`}).join('');const required=Object.values(n).reduce((a,b)=>a+b,0);const missing=Object.entries(n).reduce((a,[id,q])=>a+Math.max(0,q-(state.inventory[id]||0)),0);const extra=ingredients.reduce((a,x)=>a+Math.max(0,(state.inventory[x.id]||0)-(n[x.id]||0)),0);return `<section class="panel"><h2 class="title">Summary <small>Unfinished base recipes through next Monday</small></h2>${rows?`<div class="cov-list">${rows}</div>`:'<div class="empty">Nothing planned to cook yet.</div>'}<div class="stats cov-totals"><div class="stat"><b>${required.toLocaleString()}</b><span>Required</span></div><div class="stat"><b class="short-num">${missing.toLocaleString()}</b><span>Shortfall</span></div><div class="stat"><b class="ok-num">${extra.toLocaleString()}</b><span>Extras</span></div></div></section>`}
function timelinePanel(){const short=shortageTimeline();return `<section class="panel"><h2 class="title">Ingredient timeline <small>First shortages through next Monday</small></h2>${short.length?`<div class="priority-list">${short.map(x=>`<div class="priority">${ingredientIcon(x.id,'timeline-icon')}<div><div class="name">${I[x.id]?.name||x.id}</div><div class="sub">Need ${x.short} more by ${x.slot.label} ${x.slot.meal}</div></div><span class="badge ${x.slot.day<2?'urgent':''}">${x.slot.day===0?'Today':x.slot.day===1?'Tomorrow':'Later'}</span></div>`).join('')}</div>`:'<div class="empty">Your current planned base recipes are covered.</div>'}</section>`}
function surplusPanel(){const n=needs(),surplus=ingredients.map(x=>({x,q:Math.max(0,(state.inventory[x.id]||0)-(n[x.id]||0))})).filter(x=>x.q>0);return `<section class="panel"><h2 class="title">Filler surplus <small>Current bag minus unfinished planned base recipes</small></h2>${surplus.length?`<div class="ings">${surplus.map(({x,q})=>`<span class="ing" title="${x.name}">${ingredientIcon(x.id)} ${q}</span>`).join('')}</div>`:'<div class="empty">No filler surplus right now.</div>'}</section>`}
function recipeAssignments(id){return slots(7).filter(x=>state.plans[x.key]&&state.plans[x.key].recipe===id).map(x=>({label:`${x.label} · ${x.meal}`,cooked:!!state.plans[x.key].cooked}))}
function recipeCard(r,selectable=true,note=''){const over=total(r)>state.pot;const value=powered(r);const strength=value===null?'Base strength: —':`Base strength: ${value.toLocaleString()}`;return `<article class="recipe ${over?'over':''}"><div class="recipe-top"><div class="dish"><img src="${r.image}" alt="${r.name}" onerror="imageFallback(this)"></div><div><h3>${r.name}</h3><div class="category">${r.cat}</div></div></div><div class="ing-total">${total(r)} INGREDIENTS</div><div class="level-row"><span class="level-label">Lv.</span>${stepper(r.id,state.levels[r.id]||1,'rlevel',1,70)}</div><div class="power"><b>${strength}</b></div>${note}${(()=>{const a=recipeAssignments(r.id);if(!a.length)return '';const shown=a.slice(0,2).map(x=>x.label+(x.cooked?' (cooked)':'')).join(', ');return `<div class="assigned">Planned: ${shown}${a.length>2?` +${a.length-2} more`:''}</div>`})()}<div class="ings">${iconList(r.ings)}</div>${selectable?`<button class="primary select" data-pick="${r.id}">Add to a meal</button>`:''}</article>`}
function pastMealCard(s){const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!r)return `<div class="meal past"><h3>${s.meal}</h3><div class="meal-name">Nothing planned</div></div>`;return `<div class="meal past"><h3>${s.meal}</h3><div class="meal-name">${r.name}</div><div class="planned-recipe"><img class="planned-dish-image" src="${r.image}" alt="${r.name}" onerror="imageFallback(this)"><div class="ings meal-ingredients">${iconList(r.ings)}</div></div><div class="status">${p.cooked?'Cooked':'Not cooked'} · ${levelText(r)} · ${total(r)} ingredients</div></div>`}function mealCard(s){const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!r)return `<div class="meal"><h3>${s.meal}</h3><div class="meal-name">No recipe selected</div><div class="status">Choose a recipe</div><button class="primary" data-select="${s.key}">Select recipe</button></div>`;return `<div class="meal"><h3>${s.meal}</h3><div class="meal-name">${r.name}</div><div class="planned-recipe"><img class="planned-dish-image" src="${r.image}" alt="${r.name}" onerror="imageFallback(this)"><div class="ings meal-ingredients">${iconList(r.ings)}</div></div><div class="status">${p.cooked?'Cooked':'Planned'} · ${levelText(r)} · ${total(r)} ingredients</div><div class="row">${p.cooked?'<button class="secondary" disabled>Cooked</button>':`<button class="primary" data-cook="${s.key}">Mark cooked</button>`}<button class="secondary" data-select="${s.key}">Change</button></div></div>`}
function today(){const n=needs(1),missing=Object.entries(n).reduce((a,[id,q])=>a+Math.max(0,q-(state.inventory[id]||0)),0);return `<section class="panel"><h2 class="title">Today <small>${day(0).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</small></h2></section>${inventoryPanel('today')}<div class="stats"><div class="stat"><b>${Object.values(n).reduce((a,b)=>a+b,0)}</b><span>Ingredients needed today</span></div><div class="stat"><b>${missing}</b><span>Missing for remaining meals</span></div><div class="stat"><b>${slots(7).filter(s=>state.plans[s.key]&&!state.plans[s.key].cooked).length}</b><span>Upcoming planned meals</span></div></div><section class="panel"><h2 class="title">Remaining meals <small>All choices stay editable until cooked</small></h2><div class="row" style="margin-bottom:10px"><button class="danger" data-clear="today">Reset today\u2019s meals</button></div><div class="meal-grid">${slots(1).map(mealCard).join('')}</div></section>${timelinePanel()}${surplusPanel()}${coveragePanel(7)}`}
function dayGroups(){const out=[];slotsFor(weekStart(),mondayOffset()).forEach(s=>{if(s.meal==='Breakfast')out.push({day:s.day,label:s.label,slots:[]});out[out.length-1].slots.push(s)});return out}
function dayStatus(g){const planned=g.slots.filter(s=>state.plans[s.key]);const cooked=planned.filter(s=>state.plans[s.key].cooked);return{planned:planned.length,cooked:cooked.length,done:planned.length>0&&cooked.length===planned.length}}
function syncDayOpen(){const t=dk(day(0));if(state.dayOpenDate!==t){state.dayOpen={};state.dayOpenDate=t}}function dayIsOpen(g){const key='d'+g.day;if(state.dayOpen&&state.dayOpen[key]!==undefined)return !!state.dayOpen[key];return g.day>=0&&!dayStatus(g).done}
function plan(){syncDayOpen();const m=mondayOffset(),groups=dayGroups();const panels=groups.map(g=>{const st=dayStatus(g),open=dayIsOpen(g),past=g.day<0;const title=g.day===m?'Next Monday':g.day===0?'Today':g.day===1?'Tomorrow':g.day===-1?'Yesterday':day(g.day).toLocaleDateString(undefined,{weekday:'long'});const meta=(st.planned?`${st.planned} planned · ${st.cooked} cooked`:'Nothing planned')+(st.done?' ✓':'')+(past?' · past':'');return `<section class="panel day-panel"><button class="day-head" data-toggle-day="d${g.day}" aria-expanded="${open}"><span class="day-title">${title}<small>${day(g.day).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</small></span><span class="day-meta">${meta}</span><span class="chevron">${open?'Hide ▴':'Show ▾'}</span></button>${open?`<div class="meal-grid">${g.slots.map(past?pastMealCard:mealCard).join('')}</div>`:''}</section>`}).join('');return `<section class="panel"><h2 class="title">Plan <small>${day(weekStart()).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} – ${day(m).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</small></h2><div class="row"><button class="danger" data-clear="plan">Reset plan</button></div></section>${inventoryPanel('plan')}${panels}${timelinePanel()}${surplusPanel()}${coveragePanel(7)}`}
function recipeView(){return `<section class="panel"><h2 class="title">Recipes <small>${state.category}</small></h2><div class="toolbar"><input id="search" placeholder="Search recipes…"><button id="makeable" class="filter-button ${state.makeable?'active':''}" aria-pressed="${state.makeable}">${state.makeable?'✓ ':''}What can I make?</button><button id="mondayPicks" class="filter-button ${state.mondayPicks?'active':''}" aria-pressed="${!!state.mondayPicks}">${state.mondayPicks?'✓ ':''}Monday picks</button><select id="sort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="recipeGrid" class="recipes"></div></section>`}
function universalIngredients(){const cats={};recipes.forEach(r=>{const c=(cats[r.cat]=cats[r.cat]||{});Object.keys(r.ings).forEach(id=>c[id]=(c[id]||0)+1)});const cs=Object.values(cats);if(!cs.length)return new Set();const score=ingredients.map(x=>({id:x.id,min:Math.min(...cs.map(c=>c[x.id]||0)),sum:cs.reduce((a,c)=>a+(c[x.id]||0),0)})).filter(x=>x.min>0).sort((a,b)=>b.min-a.min||b.sum-a.sum);return new Set(score.slice(0,6).map(x=>x.id))}
function leftoverInventory(excludeKey){const left={...state.inventory};slots(7).forEach(s=>{if(s.key===excludeKey)return;const p=state.plans[s.key],r=p&&recipe(p.recipe);if(!p||p.cooked||!r)return;Object.entries(r.ings).forEach(([id,q])=>left[id]=(left[id]||0)-q)});return left}
function mondayInfo(r,left,uni){const short=Object.entries(r.ings).reduce((a,[id,q])=>a+Math.max(0,q-Math.max(0,left[id]||0)),0);const flexQ=Object.entries(r.ings).reduce((a,[id,q])=>a+(uni.has(id)?q:0),0);return{short,fits:short===0&&total(r)<=state.pot,flex:Math.round(flexQ/Math.max(1,total(r))*100)}}
function mondayHeader(left,uni){const list=ingredients.filter(x=>uni.has(x.id)&&state.enabled[x.id]);return `<div class="monday-note"><b>Monday picks</b> · all categories, ranked by what fits your bag after planned meals, then by how much uses the ingredients most common across all three categories.${list.length?`<div class="monday-uni">Most flexible ingredients (left after plans): ${list.map(x=>`<span class="ing">${ingredientIcon(x.id)} ${Math.max(0,left[x.id]||0)}</span>`).join('')}</div>`:''}</div>`}
function drawRecipes({master=false,target='recipeGrid',picker=false}={}){const root=document.getElementById(target);if(!root)return;const q=(document.getElementById(picker?'pickerSearch':'search')?.value||'').toLowerCase(),makeable=picker?state.pickerMakeable:state.makeable,sort=document.getElementById(picker?'pickerSort':'sort')?.value||'power';const monday=picker?state.pickerMonday:state.mondayPicks;let list=recipes.filter(r=>(master||(allowed(r)&&(monday||r.cat===state.category)))&&r.name.toLowerCase().includes(q));if(monday){const left=leftoverInventory(picker?state.selectedSlot:null),uni=universalIngredients();const info={};list.forEach(r=>info[r.id]=mondayInfo(r,left,uni));list.sort((a,b)=>{const A=info[a.id],B=info[b.id];if(A.fits!==B.fits)return A.fits?-1:1;if(!A.fits&&A.short!==B.short)return A.short-B.short;if(A.flex!==B.flex)return B.flex-A.flex;return (powered(b)||0)-(powered(a)||0)});root.innerHTML=mondayHeader(left,uni)+(list.length?list.map(r=>{const i=info[r.id];return recipeCard(r,!master,`<div class="monday-tag ${i.fits?'fits':'short'}">${i.fits?'Fits your leftovers':`Short ${i.short}`} · ${i.flex}% flexible</div>`)}).join(''):'<div class="empty">No recipes match these filters.</div>');root.querySelectorAll('[data-pick]').forEach(b=>{b.dataset.bound='1';b.onclick=()=>chooseRecipe(b.dataset.pick)});bindRecipeLevels(root);return}if(!master&&!state.showOver)list=list.filter(r=>total(r)<=state.pot);if(makeable)list=list.filter(r=>total(r)<=state.pot&&Object.entries(r.ings).every(([id,n])=>(state.inventory[id]||0)>=n));list.sort((a,b)=>sort==='power'?((powered(b)||0)-(powered(a)||0)):sort==='ingredients'?total(b)-total(a):a.name.localeCompare(b.name));root.innerHTML=list.length?list.map(r=>recipeCard(r,!master)).join(''):'<div class="empty">No recipes match these filters.</div>';root.querySelectorAll('[data-pick]').forEach(b=>{b.dataset.bound='1';b.onclick=()=>chooseRecipe(b.dataset.pick)});bindRecipeLevels(root)}
function setRecipeLevel(id,level){state.levels[id]=Math.max(1,Math.min(70,Math.round(level)||1));save()}
function bindRecipeLevels(root){root.querySelectorAll('[data-rlevel]').forEach(b=>b.onclick=()=>{const input=root.querySelector(`[data-rlevel-input="${b.dataset.rlevel}"]`);setRecipeLevel(b.dataset.rlevel,(+input.value||0)+Number(b.dataset.step));input.value=state.levels[b.dataset.rlevel];updateStrength(root,b.dataset.rlevel)});root.querySelectorAll('[data-rlevel-input]').forEach(input=>{input.onchange=()=>{setRecipeLevel(input.dataset.rlevelInput,+input.value);input.value=state.levels[input.dataset.rlevelInput];updateStrength(root,input.dataset.rlevelInput)}})}
function updateStrength(root,id){const card=root.querySelector(`[data-rlevel-input="${id}"]`)?.closest('.recipe'),r=recipe(id);if(!card||!r)return;const value=powered(r);card.querySelector('.power b').textContent=value===null?'Base strength: —':`Base strength: ${value.toLocaleString()}`}

// Refresh the main page only; this does not rebuild the cooking popup.

// Settings drawer: category, shared pot size, ingredients, AI settings, and backups.
function openDrawer(){const enabled=ingredients.filter(x=>state.enabled[x.id]).length;document.getElementById('drawer').innerHTML=`<div class="drawer-head"><h2>Settings</h2><button id="closeDrawer" class="close">×</button></div><div class="field"><label>Weekly category</label><select id="dcat"><option>Curry / Stew</option><option>Salad</option><option>Dessert / Drink</option></select></div><div class="divider"></div><div class="field"><label>Normal cooking pot size</label><div class="stepper pot-stepper"><button id="minus">−</button><input id="dpot" type="number" min="1" max="200" value="${state.pot}"><button id="plus">+</button></div></div><div class="divider"></div><label class="filter-button"><input id="showOver" type="checkbox" ${state.showOver?'checked':''}> Show recipes over normal pot size</label><div class="divider"></div><h3 style="margin:0 0 6px">Available ingredients</h3><p class="hint">${enabled} / ${ingredients.length} enabled. Disabled ingredients hide their recipes from normal browsing, meal selection, and “What can I make?”</p><div class="checks">${ingredients.map(x=>`<label class="check"><input type="checkbox" data-enabled="${x.id}" ${state.enabled[x.id]?'checked':''}> ${ingredientIcon(x.id)} <span>${x.name}</span></label>`).join('')}</div><div class="divider"></div><h3 style="margin:0 0 6px">Screenshot reading</h3><p class="hint">With a Google AI Studio key, bag screenshots are read by Gemini — faster and much more accurate, and it recognises the ingredient icons themselves. Without a key the app falls back to slower on-device text recognition. Your key is stored only in this browser, never in your repository.</p><div class="field"><label>Gemini API key</label><input id="dgkey" type="password" placeholder="Paste your key (optional)" value="${state.geminiKey||''}" autocomplete="off"></div><div class="field"><label>Gemini model</label><select id="dgmodel">${(state.geminiModels&&state.geminiModels.length?state.geminiModels:[state.geminiModel||'gemini-3.8-flash']).map(m=>`<option value="${m}">${m}</option>`).join('')}</select></div><div class="row"><button class="secondary" id="dgrefresh">Check available models</button></div><p class="hint" id="dgstatus"></p><div class="divider"></div><h3 style="margin:0 0 6px">Plan</h3><p class="hint">Clears all planned and cooked meals. Inventory, recipe levels, and settings are kept.</p><div class="row"><button class="danger" id="drawerClearWeek">Reset plan</button></div><div class="divider"></div><p class="hint">Your personal data is stored only in this browser. App version ${APP_VERSION}.</p><div class="row"><button class="secondary" id="export">Export backup</button><label class="secondary">Import backup<input id="import" type="file" accept="application/json" hidden></label><button class="danger" id="reset">Reset</button></div>`;document.getElementById('dcat').value=state.category;document.getElementById('dgmodel').value=state.geminiModel||'gemini-2.5-flash';document.getElementById('drawer').classList.add('show');document.getElementById('backdrop').classList.add('show');document.getElementById('closeDrawer').onclick=closeDrawer;document.getElementById('backdrop').onclick=closeDrawer;document.getElementById('minus').onclick=()=>{state.pot=Math.max(1,state.pot-1);save();openDrawer();render()};document.getElementById('plus').onclick=()=>{state.pot++;save();openDrawer();render()};document.getElementById('dpot').onchange=e=>{state.pot=Math.max(1,+e.target.value||1);save();render()};document.getElementById('dcat').onchange=e=>{state.category=e.target.value;save();render()};document.getElementById('dgkey').onchange=e=>{state.geminiKey=e.target.value.trim();save()};document.getElementById('dgmodel').onchange=e=>{state.geminiModel=e.target.value;save()};document.getElementById('dgrefresh').onclick=async()=>{const st=document.getElementById('dgstatus');st.textContent='Checking…';try{const list=await listGeminiModels();state.geminiModels=list;if(!list.includes(state.geminiModel))state.geminiModel=pickGeminiModel(list);save();openDrawer();document.getElementById('dgstatus').textContent=`${list.length} models available. Using ${state.geminiModel}.`}catch(e){st.textContent=e.message}};document.getElementById('showOver').onchange=e=>{state.showOver=e.target.checked;save();render()};document.querySelectorAll('[data-enabled]').forEach(el=>el.onchange=()=>{state.enabled[el.dataset.enabled]=el.checked;save();openDrawer();render()});document.getElementById('drawerClearWeek').onclick=()=>{closeDrawer();clearWeek('plan')};document.getElementById('export').onclick=exportData;document.getElementById('import').onchange=importData;document.getElementById('reset').onclick=()=>{if(confirm('Reset all local app data?')){state=structuredClone(defaultState);initializeState();save();closeDrawer();render()}}}
function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('backdrop').classList.remove('show')}function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('show');document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}function closeModal(){document.getElementById('modalBack').classList.remove('show');if(state.selectedSlot){state.selectedSlot=null;save()}}
// Recipe picker for a selected meal slot.
function openPicker(slot){state.selectedSlot=slot;state.pickerMakeable=false;state.pickerMonday=false;const s=slots(7).find(x=>x.key===slot);openModal(`<h2>Select recipe for ${s.label} ${s.meal}</h2><div class="toolbar"><input id="pickerSearch" placeholder="Search ${state.category} recipes…"><button id="pickerMakeable" class="filter-button" aria-pressed="false">What can I make?</button><button id="pickerMonday" class="filter-button" aria-pressed="false">Monday picks</button><select id="pickerSort"><option value="power">Sort: recipe strength</option><option value="ingredients">Sort: ingredients</option><option value="name">Sort: name</option></select></div><div id="pickerGrid" class="recipes"></div><div class="footer"><button id="cancelPicker" class="secondary">Cancel</button></div>`);drawRecipes({target:'pickerGrid',picker:true});document.getElementById('pickerSearch').oninput=()=>drawRecipes({target:'pickerGrid',picker:true});document.getElementById('pickerSort').onchange=()=>drawRecipes({target:'pickerGrid',picker:true});document.getElementById('pickerMakeable').onclick=()=>{state.pickerMakeable=!state.pickerMakeable;if(state.pickerMakeable&&state.pickerMonday){state.pickerMonday=false;const mb=document.getElementById('pickerMonday');mb.classList.remove('active');mb.setAttribute('aria-pressed',false);mb.textContent='Monday picks'}const b=document.getElementById('pickerMakeable');b.classList.toggle('active',state.pickerMakeable);b.setAttribute('aria-pressed',state.pickerMakeable);b.textContent=(state.pickerMakeable?'✓ ':'')+'What can I make?';drawRecipes({target:'pickerGrid',picker:true})};const setBtn=(id,on,txt)=>{const b=document.getElementById(id);b.classList.toggle('active',on);b.setAttribute('aria-pressed',on);b.textContent=(on?'✓ ':'')+txt};document.getElementById('pickerMonday').onclick=()=>{state.pickerMonday=!state.pickerMonday;if(state.pickerMonday){state.pickerMakeable=false;setBtn('pickerMakeable',false,'What can I make?')}setBtn('pickerMonday',state.pickerMonday,'Monday picks');drawRecipes({target:'pickerGrid',picker:true})};document.getElementById('cancelPicker').onclick=closeModal}
function openSlotChooser(id){const r=recipe(id);const rows=slots(7).map(s=>{const p=state.plans[s.key],cur=p&&recipe(p.recipe);return `<div class=\"slot-row\"><div><div class=\"name\">${s.label} · ${s.meal}</div><div class=\"sub\">${p?(p.cooked?'Cooked: ':'Planned: ')+(cur?cur.name:'—'):'Open'}</div></div><button class=\"${p?'secondary':'primary'}\" data-slot=\"${s.key}\">${p?'Replace':'Add here'}</button></div>`}).join('');openModal(`<h2>Add ${r.name} to a meal</h2><p class=\"hint\">Choose a meal slot from today through next Monday.</p><div class=\"slot-list\">${rows}</div><div class=\"footer\"><button id=\"cancelSlot\" class=\"secondary\">Cancel</button></div>`);document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{state.plans[b.dataset.slot]={recipe:id,cooked:false};save();closeModal();render()});document.getElementById('cancelSlot').onclick=closeModal}
function showAppError(msg){let el=document.getElementById('appError');if(!el){el=document.createElement('div');el.id='appError';el.className='app-error';el.onclick=()=>el.remove();document.body.appendChild(el)}el.textContent='Something went wrong: '+msg+' (tap to dismiss)'}
window.addEventListener('error',e=>showAppError(e.message||'script error'));window.addEventListener('unhandledrejection',e=>showAppError((e.reason&&e.reason.message)||'promise error'));
function chooseRecipe(id){try{if(!state.selectedSlot){openSlotChooser(id);return}state.plans[state.selectedSlot]={recipe:id,cooked:false};state.selectedSlot=null;save();closeModal();render()}catch(err){showAppError(err.message)}}
function bindModalStepper(kind,min=0,max=Infinity){document.querySelectorAll(`[data-${kind}]`).forEach(b=>b.onclick=()=>{const input=document.querySelector(`[data-${kind}-input="${b.dataset[kind]}"]`);input.value=Math.max(min,Math.min(max,(+input.value||0)+Number(b.dataset.step)))})}
function fillerSum(){return [...document.querySelectorAll('[data-fill-input]')].reduce((a,el)=>a+Math.max(0,+el.value||0),0)}
// Enforce the pot capacity and update the remaining filler allowance.
function bindFillerCap(baseTotal,pot){const cap=Math.max(0,(+pot||0)-baseTotal);const inputs=[...document.querySelectorAll('[data-fill-input]')];const update=()=>{let sum=fillerSum();if(sum>cap){let over=sum-cap;for(let i=inputs.length-1;i>=0&&over>0;i--){const v=Math.max(0,+inputs[i].value||0);const cut=Math.min(v,over);if(cut){inputs[i].value=v-cut;over-=cut}}sum=fillerSum()}const left=cap-sum;const box=document.getElementById('fillCap');if(box)box.innerHTML=`Pot size ${pot} − ${baseTotal} base ingredients = <b>${cap}</b> filler${cap===1?'':'s'} allowed · <b class="${left===0?'full':''}">${left}</b> left`;inputs.forEach(el=>{el.max=Math.max(0,+el.value||0)+left});document.querySelectorAll('[data-fill][data-step="1"]').forEach(b=>b.disabled=left<=0)};inputs.forEach(el=>{el.onchange=()=>{el.value=Math.max(0,+el.value||0);update()};el.oninput=update});document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{const el=document.querySelector(`[data-fill-input="${b.dataset.fill}"]`);const next=Math.max(0,(+el.value||0)+Number(b.dataset.step));if(Number(b.dataset.step)>0&&cap-fillerSum()<=0)return;el.value=next;update()});update()}
// Open the cooking popup without changing inventory until confirmation.
function openCook(slot) {
  const p = state.plans[slot];
  const r = recipe(p.recipe);
  const currentLevel = state.levels[r.id] || 1;

  openModal(`
    <h2>Mark cooked</h2>
    <p class="hint">Confirm the recipe level and pot size, then enter only the fillers you actually used. Filler strength is not calculated.</p>

    <div class="cooked-level">
      <label>Recipe level<br><span class="hint">Saved for ${r.name}</span></label>
      ${stepper(r.id, currentLevel, 'level', 1, 70)}
    </div>

    <div class="cooked-level">
      <label for="cookPot">Cooking pot size<br><span class="hint">Also updates your pot size in Settings</span></label>
      <div class="stepper">
        <button type="button" id="cookPotMinus" aria-label="Decrease pot size">−</button>
        <input id="cookPot" type="number" min="1" max="200" step="1" value="${state.pot}" aria-label="Cooking pot size">
        <button type="button" id="cookPotPlus" aria-label="Increase pot size">+</button>
      </div>
    </div>

    <h3>Base recipe</h3>
    ${Object.entries(r.ings).map(([id, q]) => `
      <div class="base">${ingredientIcon(id)} ${I[id]?.name || id}: <b>${q}</b></div>
    `).join('')}

    <h3>Add fillers used</h3>
    <div id="fillCap" class="fill-cap"></div>
    <div class="inventory-list filler-list">
      ${ingredients.filter(x => state.enabled[x.id]).map(x => `
        <div class="inventory-row">
          ${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id, 0, 'fill')}
        </div>
      `).join('')}
    </div>
    <div class="footer">
      <button id="cancelCook" class="secondary">Cancel</button>
      <button id="confirmCook" class="primary">Confirm cooked</button>
    </div>
  `);

  bindModalStepper('level', 1, 70);
  bindFillerCap(total(r), state.pot);
  const potInput = document.getElementById('cookPot');

  // Save the shared pot setting and refresh limits without rebuilding the popup.
  function updateCookPot(value) {
    const parsed = Number(value);
    if (!Number.isFinite(parsed)) {
      potInput.value = state.pot;
      return;
    }
    state.pot = Math.max(1, Math.min(200, Math.round(parsed)));
    potInput.value = state.pot;
    save();
    // Existing cap logic trims excess fillers if the pot becomes smaller.
    bindFillerCap(total(r), state.pot);
    render();
  }

  document.getElementById('cookPotMinus').onclick = () => updateCookPot(state.pot - 1);
  document.getElementById('cookPotPlus').onclick = () => updateCookPot(state.pot + 1);
  potInput.onchange = () => {
    if (potInput.value.trim() === '') {
      potInput.value = state.pot;
      return;
    }
    updateCookPot(potInput.value);
  };

  // Cancel leaves inventory untouched; already saved pot changes are retained.
  document.getElementById('cancelCook').onclick = closeModal;
  document.getElementById('confirmCook').onclick = () => {
    const levelInput = document.querySelector(`[data-level-input="${r.id}"]`);
    state.levels[r.id] = Math.max(1, Math.min(70, +levelInput.value || 1));

    // Combine required ingredients with fillers before deducting inventory.
    const used = { ...r.ings };
    document.querySelectorAll('[data-fill-input]').forEach(el => {
      const q = Math.max(0, +el.value || 0);
      if (q) used[el.dataset.fillInput] = (used[el.dataset.fillInput] || 0) + q;
    });
    Object.entries(used).forEach(([id, q]) => {
      state.inventory[id] = Math.max(0, (state.inventory[id] || 0) - q);
    });
    p.cooked = true;
    save();
    closeModal();
    render();
  };
}

// Gemini integration used by the existing screenshot import workflow.
async function listGeminiModels(){const key=(state.geminiKey||'').trim();if(!key)throw new Error('Paste your Gemini API key first.');const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`);if(!r.ok){let d='';try{const e=await r.json();d=e.error&&e.error.message?': '+e.error.message:''}catch(err){}throw new Error(`Could not list models (${r.status})${d}`)}const j=await r.json();return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name).replace(/^models\//,'')).filter(n=>/^gemini/.test(n)&&!/embedding|aqa|image|tts|live|audio/i.test(n))}
function pickGeminiModel(list){const score=n=>{let s=0;if(/flash/.test(n))s+=100;if(/lite/.test(n))s-=25;if(/pro/.test(n))s+=40;if(/preview|exp/.test(n))s-=30;const m=n.match(/gemini-(\d+)(?:\.(\d+))?/);if(m)s+=(+m[1])*20+(+(m[2]||0));return s};return [...list].sort((a,b)=>score(b)-score(a))[0]||'gemini-3.8-flash'}
function fileToBase64(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=()=>rej(new Error('Could not read '+file.name));fr.readAsDataURL(file)})}
async function readBagWithGemini(files,onProgress){const key=(state.geminiKey||'').trim();if(!key)throw new Error('No Gemini API key saved.');const model=state.geminiModel||'gemini-2.5-flash';const names=ingredients.map(x=>x.name).join(', ');const found={};for(let f=0;f<files.length;f++){onProgress(`Gemini is reading screenshot ${f+1} of ${files.length}…`);const b64=await fileToBase64(files[f]);const prompt=`This is a Pokémon Sleep bag (ingredient inventory) screenshot. For every ingredient tile visible, identify the ingredient and the quantity shown in its "xN" badge. Use only these ingredient names: ${names}. Ignore Pokémon, candies, items, and anything cut off so badly you cannot read the number. Respond with JSON only: {"items":[{"name":"Fancy Egg","count":30}]}`;const body={contents:[{parts:[{text:prompt},{inline_data:{mime_type:files[f].type||'image/jpeg',data:b64}}]}],generationConfig:{temperature:0,responseMimeType:'application/json'}};const callModel=async(mdl)=>fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mdl)}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let useModel=model;let resp=await callModel(useModel);if(!resp.ok&&(resp.status===404||resp.status===400)){onProgress('That Gemini model is unavailable — finding a current one…');try{const list=await listGeminiModels();const alt=pickGeminiModel(list);if(alt&&alt!==useModel){state.geminiModels=list;state.geminiModel=alt;save();useModel=alt;onProgress(`Retrying with ${alt}…`);resp=await callModel(useModel)}}catch(e){}}if(!resp.ok){let detail='';try{const e=await resp.json();detail=e.error&&e.error.message?': '+e.error.message:''}catch(err){}throw new Error(`Gemini request failed (${resp.status})${detail}`)}const data=await resp.json();const text=(((data.candidates||[])[0]||{}).content||{}).parts?data.candidates[0].content.parts.map(p=>p.text||'').join(''):'';let parsed=null;try{parsed=JSON.parse(text)}catch(e){const m=text.match(/\{[\s\S]*\}|\[[\s\S]*\]/);if(m){try{parsed=JSON.parse(m[0])}catch(e2){}}}const items=Array.isArray(parsed)?parsed:(parsed&&Array.isArray(parsed.items)?parsed.items:[]);if(!items.length)throw new Error('Gemini did not return any readable counts.');items.forEach(it=>{const raw=String(it.name||it.ingredient||'');const count=Number(String(it.count!==undefined?it.count:it.quantity).toString().replace(/[^0-9]/g,''));if(!raw||!isFinite(count))return;let hit=ingredients.find(x=>x.name.toLowerCase()===raw.toLowerCase());if(!hit){const words=raw.split(/\s+/);for(let w=words.length-1;w>=0&&!hit;w--)hit=ingredientByKeyword(words[w])}if(hit)found[hit.id]={value:Math.min(9999,Math.max(0,count)),sure:true}})}return found}
function loadOCR(){if(window.__ocrPromise)return window.__ocrPromise;window.__ocrPromise=new Promise((res,rej)=>{if(window.Tesseract)return res(window.Tesseract);const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';sc.onload=()=>res(window.Tesseract);sc.onerror=()=>rej(new Error('Could not load the text-recognition library. Check your connection and try again.'));document.head.appendChild(sc)});return window.__ocrPromise}
function fileToImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=()=>rej(new Error('Could not open '+file.name));img.src=URL.createObjectURL(file)})}
function cropCanvas(img,x0,y0,w,h,scale=4){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));const g=c.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,x0,y0,w,h,0,0,c.width,c.height);return c}
function editDistance(a,b){const m=[];for(let i=0;i<=b.length;i++){m[i]=[i];for(let j=1;j<=a.length;j++)m[i][j]=i===0?j:Math.min(m[i-1][j-1]+(b[i-1]===a[j-1]?0:1),m[i][j-1]+1,m[i-1][j]+1)}return m[b.length][a.length]}
function ingredientByKeyword(word){const w=word.toLowerCase().replace(/[^a-z]/g,'');if(w.length<3)return null;let best=null,bestScore=99;ingredients.forEach(x=>{const parts=x.name.toLowerCase().split(/\s+/);parts.forEach(p=>{const key=p.replace(/[^a-z]/g,'');if(key.length<4)return;const d=editDistance(w,key);const limit=key.length>=7?2:1;if(d<=limit&&d<bestScore){bestScore=d;best=x}})});return best}
async function readBagScreenshots(files,onProgress){const T=await loadOCR();const found={};const worker=await T.createWorker('eng');try{for(let f=0;f<files.length;f++){onProgress(`Reading screenshot ${f+1} of ${files.length}…`);const img=await fileToImage(files[f]);const page=await worker.recognize(img);const words=(page.data.words||[]).filter(w=>w.text&&w.text.trim());const anchors=[];words.forEach(w=>{const hit=ingredientByKeyword(w.text);if(!hit)return;const b=w.bbox;anchors.push({id:hit.id,cx:(b.x0+b.x1)/2,top:b.y0,h:b.y1-b.y0})});const byId={};anchors.forEach(a=>{if(!byId[a.id]||a.top<byId[a.id].top)byId[a.id]=a});for(const a of Object.values(byId)){const unit=Math.max(18,a.h);const variants=[[-2.2,-6.0,6.6,-2.3],[-3.3,-6.3,7.7,-2.0],[-1.6,-5.7,8.3,-2.6],[-4.0,-6.6,9.0,-1.8]];let best=null;for(const v of variants){const x0=Math.max(0,a.cx+v[0]*unit),y0=Math.max(0,a.top+v[1]*unit);const w=Math.min(img.naturalWidth-x0,(v[2]-v[0])*unit),h=Math.min(img.naturalHeight-y0,(v[3]-v[1])*unit);if(w<8||h<8)continue;const canvas=cropCanvas(img,x0,y0,w,h);await worker.setParameters({tessedit_char_whitelist:'0123456789x',tessedit_pageseg_mode:'7'});const r=await worker.recognize(canvas);await worker.setParameters({tessedit_char_whitelist:'',tessedit_pageseg_mode:'3'});const txt=(r.data.text||'').replace(/\s/g,'').toLowerCase();const conf=r.data.confidence||0;const strict=txt.match(/^x(\d{1,4})$/);const loose=txt.match(/(\d{1,4})/);const cand=strict?{v:+strict[1],conf,sure:true}:(loose?{v:+loose[1],conf,sure:false}:null);if(cand&&(!best||(cand.sure&&!best.sure)||(cand.sure===best.sure&&cand.conf>best.conf)))best=cand;if(best&&best.sure&&best.conf>=80)break}if(best)found[a.id]={value:Math.min(9999,best.v),sure:best.sure&&best.conf>=70}}}}finally{await worker.terminate()}return found}
function updateImportTotal(){const box=document.getElementById('importTotal');if(!box)return;const inputs=[...document.querySelectorAll('[data-import-input]')];if(!inputs.length){box.style.display='none';return}const total=inputs.reduce((a,el)=>a+Math.max(0,+el.value||0),0);box.style.display='block';box.innerHTML=`<b>${total.toLocaleString()}</b> ingredients total <span class="hint">— check this matches your bag</span>`}
// Screenshot import popup; review ingredient counts before applying them.
function openUpload(){openModal(`<h2>Import bag screenshots</h2>${(state.geminiKey||'').trim()?`<p class="hint">Choose one or more Pokémon Sleep bag screenshots. Gemini (${state.geminiModel||'gemini-3.8-flash'}) reads the counts — screenshots go to Google's API with your own key. Always check the numbers before applying.</p>`:`<p class="hint">Choose one or more Pokémon Sleep bag screenshots. Counts are read on your phone — slower and less accurate. Add a Gemini API key in Settings for much better results. Always check the numbers before applying.</p>`}<input id="shots" type="file" accept="image/*" multiple><div id="preview" class="hint" style="margin-top:10px"></div><div id="importTotal" class="import-total" style="display:none"></div><div id="reviewRows" style="margin-top:10px"></div><div class="footer"><button id="cancelUpload" class="secondary">Cancel</button><button id="applyUpload" class="primary">Apply confirmed counts</button></div>`);document.getElementById('cancelUpload').onclick=closeModal;
function drawReview(read){const list=ingredients.filter(x=>state.enabled[x.id]);document.getElementById('reviewRows').innerHTML=`<div class="inventory-list filler-list">${list.map(x=>{const hit=read&&read[x.id];const v=hit?hit.value:(state.inventory[x.id]||0);const cls=hit?(hit.sure?' read-ok':' read-check'):'';return `<div class="inventory-row${cls}">${ingredientIcon(x.id)}<label>${x.name}</label>${stepper(x.id,v,'import')}</div>`}).join('')}</div>`;bindModalStepper('import',0,Infinity);const rows=document.getElementById('reviewRows');rows.oninput=updateImportTotal;rows.onclick=()=>setTimeout(updateImportTotal,0);updateImportTotal()}
document.getElementById('shots').onchange=async e=>{const files=[...e.target.files];const note=document.getElementById('preview');if(!files.length){note.textContent='No screenshots selected.';drawReview(null);return}note.textContent=`${files.length} screenshot${files.length>1?'s':''} selected. Reading counts…`;drawReview(null);let read=null,engine='',warn='';try{if((state.geminiKey||'').trim()){try{read=await readBagWithGemini(files,msg=>{note.textContent=msg});engine='Read by Gemini ('+(state.geminiModel||'gemini-3.8-flash')+')'}catch(gerr){warn=' Gemini failed — '+gerr.message;note.textContent=gerr.message+' Falling back to on-device reading…';read=await readBagScreenshots(files,msg=>{note.textContent=msg});engine='Read on this device'}}else{read=await readBagScreenshots(files,msg=>{note.textContent=msg});engine='Read on this device (no Gemini key saved)'}const keys=Object.keys(read);const unsure=keys.filter(k=>!read[k].sure).length;note.textContent=keys.length?`${engine}: ${keys.length} count${keys.length>1?'s':''} — green is a clean read${unsure?`, amber (${unsure}) needs a check`:''}. Anything not highlighted was left as it was. Check the numbers, then apply.${warn}`:`${engine}: no counts could be read. Enter them by hand below.${warn}`;drawReview(read)}catch(err){note.textContent=err.message;drawReview(null)}};
document.getElementById('applyUpload').onclick=()=>{document.querySelectorAll('[data-import-input]').forEach(el=>state.inventory[el.dataset.importInput]=Math.max(0,+el.value||0));save();closeModal();render()}}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='cooking-planner-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);initializeState();save();closeDrawer();render();alert('Backup imported.')}catch{alert('That file could not be read as a backup.')}};r.readAsText(f)}
// Fill missing saved settings and initialize ingredient availability and inventory.
function initializeState(){state.selectedSlot=null;if(/gemini-(1\.5|2\.0|2\.5)/.test(state.geminiModel||'')){state.geminiModel='gemini-3.8-flash';state.geminiModels=[]}ingredients.forEach(x=>{if(state.enabled[x.id]===undefined)state.enabled[x.id]=true;if(state.inventory[x.id]===undefined)state.inventory[x.id]=0});state.inventoryOpen||={today:false,plan:false};if(!['Curry / Stew','Salad','Dessert / Drink'].includes(state.category))state.category='Curry / Stew'}
// Convert external ingredient and recipe JSON into the planner data model.
function normalizeData(ingredientData,recipeGroups){ingredients=ingredientData.map(raw=>({id:slug(raw.name),name:raw.name,image:raw.imageSrc||''}));I=Object.fromEntries(ingredients.map(x=>[x.id,x]));recipes=[];recipeGroups.forEach(group=>{const cat=categoryName(group.title);(group.recipes||[]).forEach(raw=>{if(!Array.isArray(raw.ingredients)||!raw.ingredients.length)return;const ings={};raw.ingredients.forEach(item=>{const id=slug(item.name);ings[id]=(ings[id]||0)+(Number(item.quantity)||0)});recipes.push({id:slug(raw.name),name:raw.name,cat,base:Number(raw.baseStrength)||0,ings,image:raw.imageSrc||''})})})}
// Load the existing data files, initialize saved state, and render the app.
async function loadData(){try{const [ingResponse,recipeResponse]=await Promise.all([fetch('./data/ingredients.json'),fetch('./data/recipes.json')]);if(!ingResponse.ok)throw new Error(`Could not load ingredients.json (${ingResponse.status})`);if(!recipeResponse.ok)throw new Error(`Could not load recipes.json (${recipeResponse.status})`);const [ingData,recipeData]=await Promise.all([ingResponse.json(),recipeResponse.json()]);normalizeData(ingData,recipeData);if(!ingredients.length)throw new Error('No ingredients were found in ingredients.json.');if(!recipes.length)throw new Error('No recipes were found in recipes.json.');initializeState();save();render()}catch(error){document.getElementById('content').innerHTML=`<div class="error"><b>The planner could not load its recipe data.</b><br>${error.message}<br><code>Expected files: ./data/ingredients.json and ./data/recipes.json</code><p>Send a screenshot of this message if it appears again.</p></div>`;console.error(error)}}
loadData();
